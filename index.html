<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------- Design tokens ----------
Court teal:  #0F5257 / #16777D
Chalk bg:    #F7F5EE

// Admin access is enforced by Firebase Authentication (email/password) —
// Firestore security rules require request.auth != null to write, and that
// check happens on Firebase's servers, not in this file. This identifier is
// NOT a secret (same as FIREBASE_CONFIG below): it just tells Firebase which
// account to attempt signing in as. The actual password lives only in the
// Firebase console (Authentication → Users) and is never part of this file.
const ADMIN_EMAIL = "admin@rhi-pscc-tournament.app";
const DEFAULT_COURT_COUNT = 4;
const DEFAULT_TEAM_COUNT = 10;
const MAX_TEAMS = 30;
const MIN_TEAMS = 2;

// ============================ bracket math ============================
// (Verified with a standalone randomized test harness across team counts
// 2–30, including odd counts that trigger byes — see project notes.)

function generateSeeds(size) {
  let seeds = [1, 2];
  while (seeds.length < size) {
    const len = seeds.length * 2;
    const next = [];
    seeds.forEach((s) => { next.push(s); next.push(len + 1 - s); });
    seeds = next;
  }
  return seeds;
}

function largestPowerOfTwoLTE(n) {
  let p = 1;
  while (p * 2 <= n) p *= 2;
  return p;
}

function resolveStage(matches, winners) {
  return matches.map((m) => {
    const w = winners[m.id];
    if (!m.a || !m.b) return { ...m, winner: null, loser: null, status: "pending" };
    if (!w) return { ...m, winner: null, loser: null, status: "ready" };
    const winner = w === "A" ? m.a : m.b;
    const loser = w === "A" ? m.b : m.a;
    return { ...m, winner, loser, status: "done" };
  });
}

function getRound1(teams) {
  const matches = [];
  const n = teams.length;
  const pairCount = Math.floor(n / 2);
  for (let i = 0; i < pairCount * 2; i += 2) {
    matches.push({ id: `r1_${matches.length + 1}`, label: "Round 1", a: teams[i], b: teams[i + 1] });
  }
  const byeTeam = n % 2 === 1 ? teams[n - 1] : null;
  return { matches, byeTeam };
}

function getRound2(round1Resolved) {
  const { matches: r1matches, bye: r1bye } = round1Resolved;
  if (r1matches.length === 0 && !r1bye) return { matches: [], bye: null };
  if (r1matches.some((m) => m.status !== "done")) return { matches: [], bye: null };

  const winners = r1matches.map((m) => m.winner);
  // Put the round-1 bye team at the FRONT of the winners pool, not the back —
  // otherwise they can end up as the round-2 leftover too and get a second
  // consecutive bye (a bye only exists when team count is odd and >= 3, so
  // there's always a real match-winner available to take the leftover slot).
  if (r1bye) winners.unshift(r1bye);
  const losers = r1matches.map((m) => m.loser);

  const matches = [];
  let leftoverWinner = null, leftoverLoser = null;

  for (let i = 0; i + 1 < winners.length; i += 2) {
    matches.push({ id: `r2_w${matches.length + 1}`, label: "Round 2", a: winners[i], b: winners[i + 1] });
  }
  if (winners.length % 2 === 1) leftoverWinner = winners[winners.length - 1];

  for (let i = 0; i + 1 < losers.length; i += 2) {
    matches.push({ id: `r2_l${matches.length + 1}`, label: "Round 2", a: losers[i], b: losers[i + 1] });
  }
  if (losers.length % 2 === 1) leftoverLoser = losers[losers.length - 1];

  let bye = null;
  if (leftoverWinner && leftoverLoser) {
    matches.push({ id: "r2_cross", label: "Round 2", a: leftoverWinner, b: leftoverLoser });
  } else if (leftoverWinner) {
    bye = leftoverWinner;
  } else if (leftoverLoser) {
    bye = leftoverLoser;
  }
  return { matches, bye };
}

// A match score is stored as { a: <points side A scored>, b: <points side B scored> }.
// Older data may still hold a plain string (e.g. "21-15") from before scores were
// split into two fields — that's display-only and contributes 0 to point diff,
// since which number belonged to which side isn't reliably recoverable.
function computeStandings(teams, round1Resolved, round2Resolved, matchScores) {
  const wins = {}, losses = {}, diff = {};
  teams.forEach((t) => { wins[t.id] = 0; losses[t.id] = 0; diff[t.id] = 0; });
  const scores = matchScores || {};
  const apply = (resolved) => {
    resolved.matches.forEach((m) => {
      if (m.status === "done") {
        wins[m.winner.id] = (wins[m.winner.id] || 0) + 1;
        losses[m.loser.id] = (losses[m.loser.id] || 0) + 1;
        const s = scores[m.id];
        if (s && typeof s === "object" && Number.isFinite(s.a) && Number.isFinite(s.b)) {
          diff[m.a.id] = (diff[m.a.id] || 0) + (s.a - s.b);
          diff[m.b.id] = (diff[m.b.id] || 0) + (s.b - s.a);
        }
      }
    });
    if (resolved.bye) wins[resolved.bye.id] = (wins[resolved.bye.id] || 0) + 1;
  };
  apply(round1Resolved);
  apply(round2Resolved);
  return teams.map((t) => ({ team: t, wins: wins[t.id] || 0, losses: losses[t.id] || 0, diff: diff[t.id] || 0 }));
}

// Ranks teams: most wins first, then highest point differential, then original
// draw order as the final (arbitrary, but at least transparent) tiebreak.
function rankStandings(records) {
  return [...records].sort(
    (a, b) => b.wins - a.wins || b.diff - a.diff || a.team.drawOrder - b.team.drawOrder
  );
}

function getPlayoffSize(teamCount) {
  if (teamCount < 2) return 0;
  return teamCount >= 8 ? 8 : largestPowerOfTwoLTE(teamCount);
}

function getPlayoffSeeding(teams, round1Resolved, round2Resolved, matchScores) {
  const r1Ready = round1Resolved.matches.length > 0 || round1Resolved.bye;
  const r1Done = round1Resolved.matches.every((m) => m.status === "done");
  const r2Exists = round2Resolved.matches.length > 0 || round2Resolved.bye;
  const r2Done = round2Resolved.matches.every((m) => m.status === "done");
  if (!r1Ready || !r1Done || !r2Exists || !r2Done) return null;

  const size = getPlayoffSize(teams.length);
  if (size < 2) return null;
  const records = computeStandings(teams, round1Resolved, round2Resolved, matchScores);
  const sorted = rankStandings(records);
  return sorted.slice(0, size).map((r) => r.team);
}

const ROUND_LABELS = { 8: ["Quarterfinal", "Semifinal", "Final"], 4: ["Semifinal", "Final"], 2: ["Final"] };

function getPlayoffRounds(seeding, playoffWinners) {
  if (!seeding || seeding.length < 2) return [];
  const size = seeding.length;
  const labels = ROUND_LABELS[size] || [];
  const seeds = generateSeeds(size);
  let currentTeams = seeds.map((s) => seeding[s - 1]);
  const rounds = [];
  let roundIdx = 0;
  while (currentTeams.length >= 2) {
    const label = labels[roundIdx] || `Round of ${currentTeams.length}`;
    const matches = [];
    for (let i = 0; i < currentTeams.length; i += 2) {
      matches.push({ id: `po_${roundIdx}_${matches.length + 1}`, label, a: currentTeams[i], b: currentTeams[i + 1] });
    }
    const resolved = resolveStage(matches, playoffWinners);
    rounds.push({ label, matches: resolved });
    if (resolved.some((m) => m.status !== "done")) break;
    currentTeams = resolved.map((m) => m.winner);
    roundIdx++;
  }
  return rounds;
}

function teamLabel(t) {
  if (!t) return "";
  return `${t.p1 || "?"} / ${t.p2 || "?"}`;
}

// ============================ Firebase ============================

let db = null;
let auth = null;
let firebaseReady = false;
let firebaseConfigMissing = true;
try {
  const cfg = window.FIREBASE_CONFIG || {};
  firebaseConfigMissing = !cfg.apiKey || cfg.apiKey.indexOf("PASTE_YOUR") === 0;
  if (!firebaseConfigMissing) {
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    auth = firebase.auth();
    firebaseReady = true;
  }
} catch (e) {
  console.error("Firebase init failed", e);
}

function getDocRef() {
  return db.collection("tournaments").doc(window.TOURNAMENT_ID || "default");
}

// ============================ App ============================

function SetupScreen() {
  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: "#F7F5EE", minHeight: "100vh", padding: 24, color: "#16211F" }}>
      <div style={{ maxWidth: 560, margin: "40px auto", background: "#fff", border: "1px solid #E4E0D2", borderRadius: 14, padding: 24 }}>
        <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 22, fontWeight: 700, marginBottom: 10, textTransform: "uppercase" }}>
          Firebase config needed
        </div>
        <p style={{ fontSize: 14, lineHeight: 1.6, color: "#3a423f" }}>
          This page needs a live Firestore database to sync scores across every device in real time.
          Open <code>index.html</code>, find the <code>FIREBASE_CONFIG</code> block near the top, and paste in
          your Firebase project's web config (apiKey, projectId, etc.) — then re-upload the file.
        </p>
        <p style={{ fontSize: 13, lineHeight: 1.6, color: "#6C7A76" }}>
          See the setup guide that came with this file for the exact steps (create a free Firebase
          project → enable Firestore → copy the config → paste here).
        </p>
      </div>
    </div>
  );
}

function BadmintonApp() {
  const [teamCount, setTeamCount] = useState(DEFAULT_TEAM_COUNT);
  const [courtCount, setCourtCount] = useState(DEFAULT_COURT_COUNT);
  const [eventName, setEventName] = useState("RHI-PSCC Team Outing · Aug 21");
  const [players, setPlayers] = useState(Array.from({ length: DEFAULT_TEAM_COUNT * 2 }, () => ""));
  const [entryMode, setEntryModeState] = useState("random"); // random | manual
  const [manualTeamNames, setManualTeamNames] = useState(Array.from({ length: DEFAULT_TEAM_COUNT }, () => ({ p1: "", p2: "" })));
  const [teams, setTeams] = useState([]);
  const [round1Winners, setRound1Winners] = useState({});
  const [round2Winners, setRound2Winners] = useState({});
  const [playoffWinners, setPlayoffWinners] = useState({});
  const [matchScores, setMatchScores] = useState({});
  const [courtOverrides, setCourtOverrides] = useState({});
  const [minutesPerMatch, setMinutesPerMatch] = useState(15);

  const [tab, setTab] = useState("players");
  const [loaded, setLoaded] = useState(false);
  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkText, setBulkText] = useState("");
  const [toast, setToast] = useState("");
  const [isAdmin, setIsAdmin] = useState(false);
  const [pinOpen, setPinOpen] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [stageTab, setStageTab] = useState("r1");
  const [findQuery, setFindQuery] = useState("");
  const [syncState, setSyncState] = useState("connecting"); // connecting | live | error
  const [expandedTeamIds, setExpandedTeamIds] = useState(() => new Set());
  const toggleTeamExpanded = (teamId) => {
    setExpandedTeamIds((prev) => {
      const next = new Set(prev);
      if (next.has(teamId)) next.delete(teamId); else next.add(teamId);
      return next;
    });
  };
  const editingPlayers = useRef(false);
  const editingManual = useRef(false);

  // Guards the same class of race for match-level fields (scores, winners,
  // court overrides) that `editingPlayers`/`editingManual` guard for the two
  // text fields above: a remote Firestore snapshot can, in principle, echo
  // back with a version of the doc that predates a write still in flight
  // (e.g. two writes to the same match landing in quick succession — typing
  // both scores of a match within the same second). Without this, that stale
  // echo would call setMatchScores/etc with the older value and wipe out
  // what was just typed. Per-id (not a single blanket flag) so entering one
  // match's score never blocks a remote update to a *different* match.
  const pendingEdits = useRef({ matchScores: {}, round1Winners: {}, round2Winners: {}, playoffWinners: {}, courtOverrides: {} });
  const markPending = (field, id) => {
    const m = pendingEdits.current[field];
    m[id] = (m[id] || 0) + 1;
  };
  const clearPending = (field, id) => {
    const m = pendingEdits.current[field];
    const n = (m[id] || 1) - 1;
    if (n <= 0) delete m[id]; else m[id] = n;
  };
  const mergeGuarded = (field, remoteMap, localMap) => {
    const pending = pendingEdits.current[field];
    const merged = { ...remoteMap };
    Object.keys(pending).forEach((id) => {
      if (pending[id] && localMap[id] !== undefined) merged[id] = localMap[id];
    });
    return merged;
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2000); };

  // ---- remote sync ----
  const applyRemoteData = (data) => {
    if (!data) return;
    if (typeof data.teamCount === "number") setTeamCount(data.teamCount);
    if (typeof data.courtCount === "number") setCourtCount(data.courtCount);
    if (typeof data.eventName === "string") setEventName(data.eventName);
    if (data.players && !editingPlayers.current) setPlayers(data.players);
    if (typeof data.entryMode === "string") setEntryModeState(data.entryMode);
    if (data.manualTeamNames && !editingManual.current) setManualTeamNames(data.manualTeamNames);
    if (data.teams) setTeams(data.teams);
    if (data.round1Winners) setRound1Winners((prev) => mergeGuarded("round1Winners", data.round1Winners, prev));
    if (data.round2Winners) setRound2Winners((prev) => mergeGuarded("round2Winners", data.round2Winners, prev));
    if (data.playoffWinners) setPlayoffWinners((prev) => mergeGuarded("playoffWinners", data.playoffWinners, prev));
    if (data.matchScores) setMatchScores((prev) => mergeGuarded("matchScores", data.matchScores, prev));
    if (data.courtOverrides) setCourtOverrides((prev) => mergeGuarded("courtOverrides", data.courtOverrides, prev));
    if (typeof data.minutesPerMatch === "number") setMinutesPerMatch(data.minutesPerMatch);
  };

  useEffect(() => {
    if (!firebaseReady) { setLoaded(true); setSyncState("error"); return; }

    // Admin status is driven entirely by Firebase Auth's own session state —
    // the actual "are you allowed to write" check happens server-side, on
    // Firestore's rules (`allow write: if request.auth != null`), not here.
    // Firebase persists the signed-in session across reloads on its own
    // (no localStorage flag to forge), and this listener keeps `isAdmin` in
    // sync with reality even if the session expires or is revoked elsewhere.
    const unsubAuth = auth.onAuthStateChanged((user) => setIsAdmin(!!user));

    const unsub = getDocRef().onSnapshot(
      (snap) => {
        if (snap.exists) applyRemoteData(snap.data());
        setLoaded(true);
        setSyncState("live");
      },
      (err) => {
        console.error("Firestore listen error", err);
        setLoaded(true);
        setSyncState("error");
      }
    );
    return () => { unsub && unsub(); unsubAuth && unsubAuth(); };
  }, []);

  // Self-heal: `players` and `manualTeamNames` can each drift out of sync with
  // `teamCount` if the count was last changed through the OTHER entry mode's
  // bulk-paste (e.g. pasting player names in random-draw mode, then switching
  // to "Enter teams directly" — that list was never resized to match). Once
  // both lists are the correct length, this is a no-op.
  useEffect(() => {
    if (!isAdmin) return;
    if (manualTeamNames.length !== teamCount) {
      const next = Array.from({ length: teamCount }, (_, i) => manualTeamNames[i] || { p1: "", p2: "" });
      setManualTeamNames(next);
      patch({ manualTeamNames: next });
    }
    if (players.length !== teamCount * 2) {
      const next = Array.from({ length: teamCount * 2 }, (_, i) => players[i] || "");
      setPlayers(next);
      patch({ players: next });
    }
  }, [isAdmin, teamCount, manualTeamNames.length, players.length]);

  const patch = async (obj) => {
    if (!firebaseReady) { showToast("Not connected — changes won't be saved"); return; }
    try {
      await getDocRef().set(obj, { merge: true });
    } catch (e) {
      console.error("save failed", e);
      showToast("Sync error — check connection");
    }
  };

  const [unlocking, setUnlocking] = useState(false);

  // Real authentication: this call goes to Firebase's servers, which check
  // the password against the one admin account created in the Firebase
  // console. There's no local password comparison to bypass by editing
  // localStorage or reading this file's source — a wrong password is
  // rejected server-side, and a correct one returns a signed session that
  // Firestore's rules independently verify on every write.
  const tryUnlock = async () => {
    if (!firebaseReady) { showToast("Not connected — try again in a moment"); return; }
    setUnlocking(true);
    try {
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pinInput);
      setPinOpen(false);
      setPinInput("");
      showToast("Admin mode unlocked");
    } catch (e) {
      showToast("Wrong password");
      setPinInput("");
    } finally {
      setUnlocking(false);
    }
  };

  const lockAdmin = () => {
    auth.signOut();
    showToast("Switched to view-only");
  };

  // ---- team count / players ----
  const changeTeamCount = (n) => {
    const clamped = Math.max(MIN_TEAMS, Math.min(MAX_TEAMS, n || MIN_TEAMS));
    const nextPlayers = Array.from({ length: clamped * 2 }, (_, i) => players[i] || "");
    const nextManual = Array.from({ length: clamped }, (_, i) => manualTeamNames[i] || { p1: "", p2: "" });
    setTeamCount(clamped);
    setPlayers(nextPlayers);
    setManualTeamNames(nextManual);
    patch({ teamCount: clamped, players: nextPlayers, manualTeamNames: nextManual });
  };

  const changeEntryMode = (mode) => {
    setEntryModeState(mode);
    patch({ entryMode: mode });
  };

  const filledCount = players.filter((p) => p.trim()).length;
  const manualFilledCount = manualTeamNames.filter((t) => t.p1 && t.p1.trim() && t.p2 && t.p2.trim()).length;

  // Splits a pasted line like "Achal & Ashwin" / "Achal, Ashwin" / "Achal vs Ashwin"
  // into ["Achal", "Ashwin"] for the direct team-entry paste box.
  const parseTeamLine = (line) => {
    const parts = line.split(/\s*(?:&|\/|,|\bvs\.?\b|\band\b|\bwith\b|-)\s*/i).map((s) => s.trim()).filter(Boolean);
    return [parts[0] || "", parts[1] || ""];
  };

  const shuffleTeams = () => {
    const names = players.map((p) => p.trim()).filter(Boolean);
    if (names.length < 4) { showToast("Add at least 4 player names first (2 teams)"); return; }
    const shuffled = [...names];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const newTeams = [];
    for (let i = 0; i < shuffled.length; i += 2) {
      newTeams.push({ id: `t${newTeams.length + 1}`, drawOrder: newTeams.length, p1: shuffled[i], p2: shuffled[i + 1] || "BYE PARTNER" });
    }
    setTeams(newTeams);
    setRound1Winners({}); setRound2Winners({}); setPlayoffWinners({});
    setMatchScores({}); setCourtOverrides({});
    patch({ teams: newTeams, round1Winners: {}, round2Winners: {}, playoffWinners: {}, matchScores: {}, courtOverrides: {} });
    setTab("teams");
  };

  const applyBulk = () => {
    const names = bulkText.split(/\n|,/).map((s) => s.trim()).filter(Boolean).slice(0, MAX_TEAMS * 2);
    const impliedTeams = Math.max(MIN_TEAMS, Math.min(MAX_TEAMS, Math.ceil(names.length / 2)));
    const next = Array.from({ length: impliedTeams * 2 }, (_, i) => names[i] || "");
    // Also resize manualTeamNames to match, even though this is the random-draw
    // path — otherwise switching to "Enter teams directly" later shows a list
    // stuck at whatever length it was before this bulk paste changed teamCount.
    const nextManual = Array.from({ length: impliedTeams }, (_, i) => manualTeamNames[i] || { p1: "", p2: "" });
    setTeamCount(impliedTeams);
    setPlayers(next);
    setManualTeamNames(nextManual);
    patch({ teamCount: impliedTeams, players: next, manualTeamNames: nextManual });
    setBulkOpen(false);
    setBulkText("");
  };

  // Bulk paste for direct team entry: one team per line, e.g. "Achal & Ashwin".
  const applyManualBulk = () => {
    const lines = bulkText.split(/\n/).map((l) => l.trim()).filter(Boolean).slice(0, MAX_TEAMS);
    const pairs = lines.map(parseTeamLine);
    const impliedTeams = Math.max(MIN_TEAMS, Math.min(MAX_TEAMS, pairs.length || teamCount));
    const next = Array.from({ length: impliedTeams }, (_, i) => {
      const pair = pairs[i];
      return pair ? { p1: pair[0], p2: pair[1] } : { p1: "", p2: "" };
    });
    // Also resize players to match, for the same reason as above — keeps the
    // random-draw list in sync in case the admin switches modes later.
    const nextPlayers = Array.from({ length: impliedTeams * 2 }, (_, i) => players[i] || "");
    setTeamCount(impliedTeams);
    setManualTeamNames(next);
    setPlayers(nextPlayers);
    patch({ teamCount: impliedTeams, manualTeamNames: next, players: nextPlayers });
    setBulkOpen(false);
    setBulkText("");
  };

  const saveManualTeams = () => {
    const valid = manualTeamNames.filter((t) => t.p1 && t.p1.trim());
    if (valid.length < 2) { showToast("Enter at least 2 teams (both partner names)"); return; }
    const newTeams = valid.map((t, i) => ({
      id: `t${i + 1}`,
      drawOrder: i,
      p1: t.p1.trim(),
      p2: (t.p2 && t.p2.trim()) || "BYE PARTNER",
    }));
    setTeams(newTeams);
    setRound1Winners({}); setRound2Winners({}); setPlayoffWinners({});
    setMatchScores({}); setCourtOverrides({});
    patch({ teams: newTeams, round1Winners: {}, round2Winners: {}, playoffWinners: {}, matchScores: {}, courtOverrides: {} });
    setTab("teams");
  };

  // ---- derived bracket state ----
  const round1 = useMemo(() => getRound1(teams), [teams]);
  const round1Resolved = useMemo(
    () => ({ matches: resolveStage(round1.matches, round1Winners), bye: round1.byeTeam }),
    [round1, round1Winners]
  );
  const round2 = useMemo(() => getRound2(round1Resolved), [round1Resolved]);
  const round2Resolved = useMemo(
    () => ({ matches: resolveStage(round2.matches, round2Winners), bye: round2.bye }),
    [round2, round2Winners]
  );
  const records = useMemo(
    () => computeStandings(teams, round1Resolved, round2Resolved, matchScores),
    [teams, round1Resolved, round2Resolved, matchScores]
  );
  const rankedRecords = useMemo(() => rankStandings(records), [records]);
  const playoffSize = getPlayoffSize(teams.length);
  const playoffSeeding = useMemo(
    () => getPlayoffSeeding(teams, round1Resolved, round2Resolved, matchScores),
    [teams, round1Resolved, round2Resolved, matchScores]
  );
  const playoffRounds = useMemo(() => getPlayoffRounds(playoffSeeding, playoffWinners), [playoffSeeding, playoffWinners]);
  const champion = (() => {
    if (!playoffRounds.length) return null;
    const last = playoffRounds[playoffRounds.length - 1];
    return last.label === "Final" && last.matches[0] && last.matches[0].status === "done" ? last.matches[0].winner : null;
  })();

  // Builds a plain-language, round-by-round explanation of a team's path —
  // purely derived from the same deterministic data everything else on this
  // page uses (no AI/API call involved: the seeding rule is "wins, then point
  // differential, then draw order," so the reasoning can just be read straight
  // off the numbers already on screen).
  const formatMatchScore = (matchId, mySide) => {
    const s = matchScores[matchId];
    if (!s) return null;
    if (typeof s === "object" && Number.isFinite(s.a) && Number.isFinite(s.b)) {
      return mySide === "A" ? `${s.a}-${s.b}` : `${s.b}-${s.a}`;
    }
    return typeof s === "string" ? s : null;
  };
  const findMatchForTeam = (matches, teamId) => matches.find((m) => (m.a && m.a.id === teamId) || (m.b && m.b.id === teamId));
  const describeMatchStep = (label, m, teamId) => {
    if (m.status !== "done") return { label, type: "pending", text: "Not yet played" };
    const mySide = m.a.id === teamId ? "A" : "B";
    const opp = mySide === "A" ? m.b : m.a;
    const won = m.winner.id === teamId;
    const score = formatMatchScore(m.id, mySide);
    return { label, type: won ? "win" : "loss", text: `${won ? "Beat" : "Lost to"} ${teamLabel(opp)}${score ? ` (${score})` : ""}` };
  };
  const buildTeamStory = (team) => {
    const steps = [];

    if (round1Resolved.bye && round1Resolved.bye.id === team.id) {
      steps.push({ label: "Round 1", type: "bye", text: "Bye — advanced automatically" });
    } else {
      const m = findMatchForTeam(round1Resolved.matches, team.id);
      if (m) steps.push(describeMatchStep("Round 1", m, team.id));
    }

    if (round2Resolved.bye && round2Resolved.bye.id === team.id) {
      steps.push({ label: "Round 2", type: "bye", text: "Bye — advanced automatically" });
    } else {
      const m = findMatchForTeam(round2Resolved.matches, team.id);
      if (m) steps.push(describeMatchStep("Round 2", m, team.id));
    }

    const rank = rankedRecords.findIndex((r) => r.team.id === team.id);
    const record = rank >= 0 ? rankedRecords[rank] : null;

    if (record) {
      if (playoffSeeding) {
        const inPlayoffs = playoffSeeding.some((t) => t.id === team.id);
        const diffText = `${record.diff > 0 ? "+" : ""}${record.diff} point differential`;
        if (inPlayoffs) {
          // A tiebreak only matters if the team right on the outside of the
          // cutoff shares the same win count — otherwise wins alone decided it.
          const firstOut = rankedRecords[playoffSize];
          const tiebreakMattered = firstOut && firstOut.wins === record.wins;
          steps.push({
            label: "Playoff seeding",
            type: "advanced",
            text: `Advanced — seeded #${rank + 1} of ${teams.length} with a ${record.wins}-${record.losses} record` +
              (tiebreakMattered ? `, ranked ahead of teams with the same record on ${diffText}` : `, top ${playoffSize} by record`),
          });
        } else {
          const lastIn = rankedRecords[playoffSize - 1];
          const tiebreakMattered = lastIn && lastIn.wins === record.wins;
          steps.push({
            label: "Playoff seeding",
            type: "missed",
            text: `Didn't advance — finished #${rank + 1} of ${teams.length} with a ${record.wins}-${record.losses} record (top ${playoffSize} advance)` +
              (tiebreakMattered ? `, edged out by ${diffText}` : ""),
          });
        }
      } else {
        steps.push({ label: "Playoff seeding", type: "pending", text: "Round 1 & 2 still in progress" });
      }
    }

    playoffRounds.forEach((r) => {
      const m = findMatchForTeam(r.matches, team.id);
      if (m) steps.push(describeMatchStep(r.label, m, team.id));
    });

    if (champion && champion.id === team.id) {
      steps.push({ label: "Result", type: "champion", text: "🏆 Tournament champions" });
    }

    return steps;
  };

  // ---- stages for the schedule UI ----
  const stages = useMemo(() => {
    const list = [
      { key: "r1", label: "Round 1", matches: round1Resolved.matches, bye: round1Resolved.bye, bucket: "r1", locked: teams.length < MIN_TEAMS },
      { key: "r2", label: "Round 2", matches: round2Resolved.matches, bye: round2Resolved.bye, bucket: "r2", locked: round2.matches.length === 0 && !round2.bye },
    ];
    playoffRounds.forEach((r, i) => {
      list.push({ key: `po_${i}`, label: r.label, matches: r.matches, bye: null, bucket: "playoff", locked: false });
    });
    if (playoffRounds.length === 0 && playoffSize >= 2) {
      list.push({ key: "po_pending", label: "Playoffs", matches: [], bye: null, bucket: "playoff", locked: true });
    }
    return list;
  }, [round1Resolved, round2Resolved, round2, playoffRounds, playoffSize, teams.length]);

  useEffect(() => {
    // keep the selected stage tab valid as stages change
    if (!stages.find((s) => s.key === stageTab)) setStageTab(stages[0] ? stages[0].key : "r1");
  }, [stages]);

  const winnersMapFor = (bucket) => (bucket === "r1" ? round1Winners : bucket === "r2" ? round2Winners : playoffWinners);

  // Functional updater form throughout — the reconciliation pass below can call
  // this for several matches in the same tick, and reading e.g. `round1Winners`
  // from the outer closure in that case would drop all but the last correction
  // (the same stale-closure hazard fixed earlier for score entry).
  const setStageWinner = (bucket, matchId, side) => {
    const field = bucket === "r1" ? "round1Winners" : bucket === "r2" ? "round2Winners" : "playoffWinners";
    const setter = bucket === "r1" ? setRound1Winners : bucket === "r2" ? setRound2Winners : setPlayoffWinners;
    setter((prev) => ({ ...prev, [matchId]: side }));
    markPending(field, matchId);
    patch({ [field]: { [matchId]: side } }).finally(() => clearPending(field, matchId));
  };

  // Score is stored per match as { a: <points side A>, b: <points side B> } so
  // point differential can be computed unambiguously (see computeStandings).
  // The score is the single source of truth for who won: once both sides have
  // a valid, non-tied score, the winner is derived from it automatically —
  // this is what prevents the score and the winner-click ever disagreeing.
  const isValidScorePair = (s) => s && typeof s === "object" && Number.isFinite(s.a) && Number.isFinite(s.b) && s.a !== s.b;

  const setScoreSide = (bucket, matchId, side, rawValue, teamA, teamB) => {
    const n = rawValue === "" ? null : Number(rawValue);
    const val = Number.isFinite(n) ? n : null;
    // Use the functional updater form — the two score inputs (side A / side B)
    // can both blur in the same tick, and reading `matchScores` from the outer
    // closure in that case would silently drop whichever update landed first.
    setMatchScores((prev) => {
      const existing = prev[matchId];
      const base = existing && typeof existing === "object" ? existing : { a: null, b: null };
      const nextEntry = { ...base, [side]: val };
      markPending("matchScores", matchId);
      patch({ matchScores: { [matchId]: nextEntry } }).finally(() => clearPending("matchScores", matchId));
      if (isValidScorePair(nextEntry)) {
        const winSide = nextEntry.a > nextEntry.b ? "A" : "B";
        setStageWinner(bucket, matchId, winSide);
        const winnerTeam = winSide === "A" ? teamA : teamB;
        if (winnerTeam) showToast(`Winner set to ${teamLabel(winnerTeam)} (${nextEntry.a}-${nextEntry.b})`);
      } else if (existing && typeof existing === "object" && existing.a === existing.b && val !== null) {
        showToast("Scores can't be tied — double check the numbers");
      }
      return { ...prev, [matchId]: nextEntry };
    });
  };

  // Self-heal existing data: a match may already have a stored winner that
  // disagrees with its score — either it predates this auto-derive logic, or
  // it was set by a manual click before a score existed. Whenever the derived
  // and stored winners disagree, correct the stored one so the score is always
  // authoritative (admin-only, so viewers never trigger writes).
  useEffect(() => {
    if (!isAdmin) return;
    const reconcileStage = (bucket, matches) => {
      const winners = winnersMapFor(bucket);
      matches.forEach((m) => {
        const s = matchScores[m.id];
        if (!isValidScorePair(s)) return;
        const derivedSide = s.a > s.b ? "A" : "B";
        if (winners[m.id] !== derivedSide) setStageWinner(bucket, m.id, derivedSide);
      });
    };
    reconcileStage("r1", round1Resolved.matches);
    reconcileStage("r2", round2Resolved.matches);
    playoffRounds.forEach((r) => reconcileStage("playoff", r.matches));
  }, [isAdmin, matchScores, round1Resolved, round2Resolved, playoffRounds]);

  // Best-effort migration for scores entered before this field was split in two
  // (e.g. "21-15") — used only to prefill the two new inputs, never to auto-save.
  const parseLegacyScore = (str) => {
    const m = typeof str === "string" ? str.match(/(\d+)\D+(\d+)/) : null;
    return m ? { a: Number(m[1]), b: Number(m[2]) } : { a: null, b: null };
  };

  const setCourtOverride = (matchId, courtNum) => {
    const next = { ...courtOverrides, [matchId]: courtNum };
    setCourtOverrides(next);
    markPending("courtOverrides", matchId);
    patch({ courtOverrides: { [matchId]: courtNum } }).finally(() => clearPending("courtOverrides", matchId));
  };

  // court auto-assignment: round-robin per stage among "ready"/"done" matches,
  // overridden per-match by admin if set.
  const courtAssignments = useMemo(() => {
    const map = {};
    stages.forEach((s) => {
      const games = s.matches.filter((g) => g.status === "ready" || g.status === "done");
      games.forEach((g, idx) => {
        const auto = (idx % courtCount) + 1;
        const wave = Math.floor(idx / courtCount) + 1;
        const court = courtOverrides[g.id] || auto;
        map[g.id] = { court, wave, auto };
      });
    });
    return map;
  }, [stages, courtCount, courtOverrides]);

  const timeEstimate = useMemo(() => {
    let totalMinutes = 0;
    const perStage = [];
    stages.forEach((s) => {
      const games = s.matches.filter((g) => g.status === "ready" || g.status === "done");
      if (games.length === 0) return;
      const waves = Math.ceil(games.length / courtCount);
      const mins = waves * minutesPerMatch;
      totalMinutes += mins;
      perStage.push({ stage: s.key, games: games.length, waves, mins });
    });
    return { totalMinutes, perStage };
  }, [stages, courtCount, minutesPerMatch]);

  // ---- find my match ----
  const findResults = useMemo(() => {
    const q = findQuery.trim().toLowerCase();
    if (q.length < 2) return [];
    const results = [];
    stages.forEach((s) => {
      s.matches.forEach((g) => {
        const inA = g.a && (String(g.a.p1).toLowerCase().includes(q) || String(g.a.p2).toLowerCase().includes(q));
        const inB = g.b && (String(g.b.p1).toLowerCase().includes(q) || String(g.b.p2).toLowerCase().includes(q));
        if (inA || inB) {
          const court = courtAssignments[g.id];
          results.push({ stage: s.label, match: g, court, mine: inA ? g.a : g.b, opp: inA ? g.b : g.a });
        }
      });
      if (s.bye) {
        const byeMatch = String(s.bye.p1).toLowerCase().includes(q) || String(s.bye.p2).toLowerCase().includes(q);
        if (byeMatch) results.push({ stage: s.label, bye: true, mine: s.bye });
      }
    });
    return results;
  }, [findQuery, stages, courtAssignments]);

  if (firebaseConfigMissing) return <SetupScreen />;
  if (!loaded) return <div style={{ padding: 40, fontFamily: "Inter, sans-serif", color: "#6C7A76" }}>Loading…</div>;

  const activeStage = stages.find((s) => s.key === stageTab) || stages[0];

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div style={styles.headerLine} />
        <div style={styles.headerRow}>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={styles.eyebrow}>
              {syncState === "live" ? "🟢 LIVE" : syncState === "error" ? "🔴 OFFLINE" : "🟡 CONNECTING"}
            </div>
            {isAdmin ? (
              <input
                value={eventName}
                onChange={(e) => { setEventName(e.target.value); }}
                onBlur={() => patch({ eventName })}
                style={styles.eventNameInput}
              />
            ) : (
              <h1 style={styles.h1}>{eventName}</h1>
            )}
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, flexShrink: 0 }}>
            <div style={styles.courtBadge}>{courtCount} COURTS</div>
            {isAdmin ? (
              <button style={styles.adminPillOn} onClick={lockAdmin}>Admin ✓ (tap to lock)</button>
            ) : (
              <button style={styles.adminPillOff} onClick={() => setPinOpen(!pinOpen)}>Admin sign-in</button>
            )}
          </div>
        </div>
        {pinOpen && !isAdmin && (
          <div style={styles.pinRow}>
            <input
              value={pinInput}
              onChange={(e) => setPinInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && !unlocking && tryUnlock()}
              placeholder="Enter admin password"
              type="password"
              autoComplete="current-password"
              disabled={unlocking}
              style={styles.pinInput}
            />
            <button style={styles.primaryBtn} onClick={tryUnlock} disabled={unlocking}>
              {unlocking ? "Checking…" : "Unlock"}
            </button>
          </div>
        )}
      </header>

      {!isAdmin && (
        <div style={styles.viewBanner}>
          👀 View-only — updates from the organizer appear here automatically, no refresh needed.
        </div>
      )}
      {syncState === "error" && (
        <div style={styles.errorBanner}>
          ⚠️ Not connected to the live database. Changes won't sync to other devices. (Check your internet connection, or the Firebase config if you're the admin.)
        </div>
      )}

      <div style={styles.findBar}>
        <input
          value={findQuery}
          onChange={(e) => setFindQuery(e.target.value)}
          placeholder="🔎 Find your match — type your name"
          style={styles.findInput}
        />
        {findQuery.trim().length >= 2 && (
          <div style={styles.findResults}>
            {findResults.length === 0 && <div style={styles.findEmpty}>No match found yet for "{findQuery}"</div>}
            {findResults.map((r, i) => (
              <div key={i} style={styles.findCard}>
                <div style={styles.findStage}>{r.stage}</div>
                {r.bye ? (
                  <div style={styles.findLine}><strong>{teamLabel(r.mine)}</strong> — bye this round, advances automatically</div>
                ) : (
                  <>
                    <div style={styles.findLine}>
                      <strong>{teamLabel(r.mine)}</strong> vs {teamLabel(r.opp)}
                    </div>
                    <div style={styles.findMeta}>
                      {r.court && <span style={styles.courtTag}>Court {r.court.court} · Wave {r.court.wave}</span>}
                      <span style={styles.findStatus}>
                        {r.match.status === "done" ? `Final${r.match.winner === r.mine ? " — won" : " — lost"}` : r.match.status === "ready" ? "Ready to play" : "Waiting"}
                      </span>
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <nav style={styles.tabs}>
        {[
          { key: "players", label: entryMode === "manual" ? `Setup (${manualFilledCount}/${teamCount})` : `Players (${filledCount}/${teamCount * 2})` },
          { key: "teams", label: `Teams (${teams.length})` },
          { key: "schedule", label: "Schedule" },
          { key: "standings", label: "Standings" },
        ].map((t) => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{ ...styles.tabBtn, ...(tab === t.key ? styles.tabBtnActive : {}) }}>
            {t.label}
          </button>
        ))}
      </nav>

      <main style={styles.main}>
        {tab === "players" && (
          <section>
            <div style={styles.sectionHead}>
              <h2 style={styles.h2}>{entryMode === "manual" ? "Enter teams directly" : "Enter players"}</h2>
              {isAdmin && (
                <button style={styles.linkBtn} onClick={() => setBulkOpen(!bulkOpen)}>
                  {bulkOpen ? "Close paste box" : entryMode === "manual" ? "Paste team list" : "Paste all names"}
                </button>
              )}
            </div>

            {isAdmin && (
              <div style={styles.modeToggleRow}>
                <button
                  style={{ ...styles.modeBtn, ...(entryMode === "random" ? styles.modeBtnActive : {}) }}
                  onClick={() => changeEntryMode("random")}
                >
                  Random draw
                </button>
                <button
                  style={{ ...styles.modeBtn, ...(entryMode === "manual" ? styles.modeBtnActive : {}) }}
                  onClick={() => changeEntryMode("manual")}
                >
                  Enter teams directly
                </button>
              </div>
            )}
            {isAdmin && (
              <p style={styles.mutedSmall}>
                {entryMode === "manual"
                  ? "Type each team's two partner names directly — no random shuffling. Use this when players have already picked their own partners."
                  : "Enter every player's name, then shuffle into random doubles teams. Switch to \"Enter teams directly\" if partners are already decided."}
              </p>
            )}

            {isAdmin && (
              <div style={styles.card}>
                <div style={styles.settingsRow}>
                  <label style={styles.settingsLabel}>Number of teams</label>
                  <div style={styles.stepper}>
                    <button style={styles.stepperBtn} onClick={() => changeTeamCount(teamCount - 1)}>−</button>
                    <input
                      type="number" min={MIN_TEAMS} max={MAX_TEAMS} value={teamCount}
                      onChange={(e) => changeTeamCount(Number(e.target.value))}
                      style={styles.stepperInput}
                    />
                    <button style={styles.stepperBtn} onClick={() => changeTeamCount(teamCount + 1)}>+</button>
                  </div>
                </div>
                <div style={styles.settingsRow}>
                  <label style={styles.settingsLabel}>Number of courts</label>
                  <div style={styles.stepper}>
                    <button style={styles.stepperBtn} onClick={() => { const v = Math.max(1, courtCount - 1); setCourtCount(v); patch({ courtCount: v }); }}>−</button>
                    <input
                      type="number" min={1} max={12} value={courtCount}
                      onChange={(e) => { const v = Math.max(1, Math.min(12, Number(e.target.value) || 1)); setCourtCount(v); patch({ courtCount: v }); }}
                      style={styles.stepperInput}
                    />
                    <button style={styles.stepperBtn} onClick={() => { const v = Math.min(12, courtCount + 1); setCourtCount(v); patch({ courtCount: v }); }}>+</button>
                  </div>
                </div>
                <p style={styles.mutedSmall}>Up to {MAX_TEAMS} teams supported. Changing team count resizes the list below (existing names are kept where possible).</p>
              </div>
            )}

            {bulkOpen && isAdmin && entryMode === "random" && (
              <div style={styles.card}>
                <textarea
                  value={bulkText}
                  onChange={(e) => setBulkText(e.target.value)}
                  placeholder={"One name per line (or comma-separated)\nRavi\nPriya\nJon\n..."}
                  rows={6}
                  style={styles.textarea}
                />
                <button style={styles.primaryBtn} onClick={applyBulk}>Fill names (sets team count automatically)</button>
              </div>
            )}

            {bulkOpen && isAdmin && entryMode === "manual" && (
              <div style={styles.card}>
                <textarea
                  value={bulkText}
                  onChange={(e) => setBulkText(e.target.value)}
                  placeholder={"One team per line\nAchal & Ashwin\nAnnette / Barbara\nBhavan, Carrie\n..."}
                  rows={6}
                  style={styles.textarea}
                />
                <button style={styles.primaryBtn} onClick={applyManualBulk}>Fill teams (sets team count automatically)</button>
              </div>
            )}

            {entryMode === "random" ? (
              <>
                <div style={styles.playerGrid}>
                  {players.map((p, i) => (
                    <div key={i} style={styles.playerRow}>
                      <span style={styles.playerNum}>{i + 1}</span>
                      <input
                        value={p}
                        disabled={!isAdmin}
                        onFocus={() => { editingPlayers.current = true; }}
                        onChange={(e) => {
                          const next = [...players];
                          next[i] = e.target.value;
                          setPlayers(next);
                        }}
                        onBlur={() => { editingPlayers.current = false; patch({ players }); }}
                        placeholder={`Player ${i + 1}`}
                        style={{ ...styles.input, ...(!isAdmin ? styles.inputDisabled : {}) }}
                      />
                    </div>
                  ))}
                </div>

                {isAdmin ? (
                  <button style={styles.primaryBtnLg} onClick={shuffleTeams}>Shuffle into doubles teams →</button>
                ) : (
                  <p style={styles.muted}>Sign in as admin to edit names or shuffle teams.</p>
                )}
              </>
            ) : (
              <>
                <div style={styles.manualTeamList}>
                  {manualTeamNames.map((t, i) => (
                    <div key={i} style={styles.manualTeamRow}>
                      <span style={styles.playerNum}>T{i + 1}</span>
                      <input
                        value={t.p1}
                        disabled={!isAdmin}
                        onFocus={() => { editingManual.current = true; }}
                        onChange={(e) => {
                          const next = manualTeamNames.map((x, idx) => (idx === i ? { ...x, p1: e.target.value } : x));
                          setManualTeamNames(next);
                        }}
                        onBlur={() => { editingManual.current = false; patch({ manualTeamNames }); }}
                        placeholder="Partner A"
                        style={{ ...styles.input, ...(!isAdmin ? styles.inputDisabled : {}) }}
                      />
                      <span style={styles.teamAmp}>&amp;</span>
                      <input
                        value={t.p2}
                        disabled={!isAdmin}
                        onFocus={() => { editingManual.current = true; }}
                        onChange={(e) => {
                          const next = manualTeamNames.map((x, idx) => (idx === i ? { ...x, p2: e.target.value } : x));
                          setManualTeamNames(next);
                        }}
                        onBlur={() => { editingManual.current = false; patch({ manualTeamNames }); }}
                        placeholder="Partner B"
                        style={{ ...styles.input, ...(!isAdmin ? styles.inputDisabled : {}) }}
                      />
                    </div>
                  ))}
                </div>

                {isAdmin ? (
                  <button style={styles.primaryBtnLg} onClick={saveManualTeams}>Save teams →</button>
                ) : (
                  <p style={styles.muted}>The admin is entering teams directly — check back shortly.</p>
                )}
              </>
            )}
          </section>
        )}

        {tab === "teams" && (
          <section>
            <div style={styles.sectionHead}>
              <h2 style={styles.h2}>Doubles teams</h2>
              {isAdmin && teams.length > 0 && (
                entryMode === "manual"
                  ? <button style={styles.linkBtn} onClick={() => setTab("players")}>Edit teams</button>
                  : <button style={styles.linkBtn} onClick={shuffleTeams}>Reshuffle</button>
              )}
            </div>
            {teams.length === 0 ? (
              <p style={styles.muted}>No teams yet — go to Players and shuffle first.</p>
            ) : (
              <>
                <div style={styles.teamGrid}>
                  {teams.map((t, i) => (
                    <div key={t.id} style={styles.teamCard}>
                      <div style={styles.teamNum}>T{i + 1}</div>
                      <div style={styles.teamNames}>
                        <div>{t.p1}</div>
                        <div style={styles.teamAmp}>&amp;</div>
                        <div>{t.p2}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <button style={styles.primaryBtnLg} onClick={() => setTab("schedule")}>
                  {isAdmin ? "Build the schedule →" : "View the schedule →"}
                </button>
              </>
            )}
          </section>
        )}

        {tab === "schedule" && (
          <section>
            {teams.length < MIN_TEAMS ? (
              <p style={styles.muted}>Generate at least 2 teams first.</p>
            ) : (
              <>
                <div style={styles.formatNote}>
                  Round 1 &amp; 2: everyone plays both, guaranteed (odd team counts get one bye per round). Top {playoffSize || "N"} records advance to a single-elimination playoff.
                </div>

                {isAdmin && (
                  <div style={styles.timeCard}>
                    <div style={styles.timeRow}>
                      <span>Minutes per match</span>
                      <input
                        type="number" min={5} max={60} value={minutesPerMatch}
                        onChange={(e) => { const v = Number(e.target.value) || 15; setMinutesPerMatch(v); patch({ minutesPerMatch: v }); }}
                        style={styles.miniInput}
                      />
                    </div>
                    <div style={styles.timeRow}>
                      <span>Est. total time ({courtCount} courts, sequential rounds)</span>
                      <strong style={{ color: timeEstimate.totalMinutes > 120 ? "#B4483A" : "#0F5257" }}>
                        {Math.round(timeEstimate.totalMinutes / 60 * 10) / 10}h ({timeEstimate.totalMinutes}m)
                      </strong>
                    </div>
                    {timeEstimate.totalMinutes > 120 && (
                      <div style={styles.warnLine}>Over your 2-hour window — consider shorter matches or more courts.</div>
                    )}
                  </div>
                )}

                <div style={styles.roundTabs}>
                  {stages.map((s) => (
                    <button
                      key={s.key}
                      onClick={() => !s.locked && setStageTab(s.key)}
                      disabled={s.locked}
                      style={{ ...styles.roundTabBtn, ...(stageTab === s.key ? styles.roundTabBtnActive : {}), ...(s.locked ? styles.roundTabBtnLocked : {}) }}
                    >
                      {s.locked ? `🔒 ${s.label}` : s.label}
                    </button>
                  ))}
                </div>

                <div style={styles.matchList}>
                  {activeStage.locked && (
                    <p style={styles.muted}>
                      {activeStage.key === "r2" && "Unlocks once all Round 1 matches have a recorded winner."}
                      {activeStage.key === "po_pending" && `Unlocks once Round 1 and Round 2 are both complete — top ${playoffSize} records advance.`}
                    </p>
                  )}
                  {!activeStage.locked && activeStage.bye && (
                    <div style={styles.byeCard}>🎟️ <strong>{teamLabel(activeStage.bye)}</strong> — bye this round, advances automatically</div>
                  )}
                  {!activeStage.locked && activeStage.matches.length === 0 && !activeStage.bye && (
                    <p style={styles.muted}>No matches in this round.</p>
                  )}
                  {!activeStage.locked && activeStage.matches.map((g) => {
                    if (g.status === "pending") return <div key={g.id} style={styles.pendingCard}>Waiting on earlier matches</div>;
                    const court = courtAssignments[g.id];
                    const winnerSide = winnersMapFor(activeStage.bucket)[g.id];
                    return (
                      <div key={g.id} style={styles.matchCard}>
                        <div style={styles.matchMeta}>
                          {court && <span style={styles.courtTag}>Court {court.court} · Wave {court.wave}</span>}
                          {isAdmin && court && (
                            <span style={styles.courtOverrideRow}>
                              <select
                                value={courtOverrides[g.id] || ""}
                                onChange={(e) => setCourtOverride(g.id, e.target.value ? Number(e.target.value) : null)}
                                style={styles.courtSelect}
                              >
                                <option value="">Auto (Court {court.auto})</option>
                                {Array.from({ length: courtCount }, (_, i) => i + 1).map((c) => (
                                  <option key={c} value={c}>Move to Court {c}</option>
                                ))}
                              </select>
                            </span>
                          )}
                        </div>
                        {(() => {
                          const existing = matchScores[g.id];
                          const struct = existing && typeof existing === "object" ? existing : parseLegacyScore(existing);
                          const hasScore = isValidScorePair(struct);
                          const rows = [
                            { side: "A", team: g.a, val: struct.a },
                            { side: "B", team: g.b, val: struct.b },
                          ];
                          return (
                            <div style={styles.matchTeams}>
                              {rows.map(({ side, team, val }) => {
                                const isWinner = winnerSide === side;
                                return (
                                  <div key={side} style={styles.teamScoreRow}>
                                    <button
                                      onClick={() => isAdmin && !hasScore && setStageWinner(activeStage.bucket, g.id, side)}
                                      disabled={!isAdmin || hasScore}
                                      style={{ ...styles.sideBtn, ...(isWinner ? styles.sideBtnWin : {}), ...(!isAdmin || hasScore ? styles.sideBtnReadOnly : {}) }}
                                    >
                                      {isWinner && <span style={styles.trophyMark}>🏆 </span>}
                                      {teamLabel(team)}
                                    </button>
                                    {isAdmin ? (
                                      <input
                                        key={g.id + "_" + side.toLowerCase() + "_" + (val ?? "")}
                                        type="number" min={0} max={99}
                                        defaultValue={val ?? ""}
                                        placeholder="pts"
                                        onBlur={(e) => setScoreSide(activeStage.bucket, g.id, side.toLowerCase(), e.target.value, g.a, g.b)}
                                        style={styles.scoreInputInline}
                                      />
                                    ) : (
                                      Number.isFinite(val) && <div style={styles.scoreDisplayInline}>{val}</div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })()}
                        {isAdmin && (() => {
                          const existing = matchScores[g.id];
                          const struct = existing && typeof existing === "object" ? existing : null;
                          if (struct && isValidScorePair(struct)) {
                            return <div style={styles.winnerNote}>Winner set automatically from the score — edit either score to change it</div>;
                          }
                          return <div style={styles.winnerNote}>Enter both scores, or tap a team to set the winner directly</div>;
                        })()}
                        {!winnerSide && !isAdmin && <div style={styles.winnerNote}>Result pending</div>}
                      </div>
                    );
                  })}
                </div>

                {champion && <div style={styles.championCard}>🏆 Champions: {teamLabel(champion)}</div>}
              </>
            )}
          </section>
        )}

        {tab === "standings" && (
          <section>
            <h2 style={styles.h2}>Standings</h2>
            {teams.length === 0 ? (
              <p style={styles.muted}>Generate teams first.</p>
            ) : (
              <>
                <p style={styles.mutedSmall}>
                  Ranked by wins, then point differential (from entered scores), then original draw order as a last resort.
                  Tap a team to see why they advanced (or didn't), round by round.
                </p>
                <div style={styles.standingsList}>
                  {rankedRecords.map(({ team, wins, losses, diff }) => {
                    const inPlayoffs = playoffSeeding && playoffSeeding.some((t) => t.id === team.id);
                    const isOpen = expandedTeamIds.has(team.id);
                    return (
                      <div key={team.id} style={styles.standCard}>
                        <button
                          onClick={() => toggleTeamExpanded(team.id)}
                          style={styles.standRow}
                          aria-expanded={isOpen}
                        >
                          <span style={{ ...styles.standChevron, ...(isOpen ? styles.standChevronOpen : {}) }}>▸</span>
                          <span style={styles.standName}>{teamLabel(team)}</span>
                          <span style={styles.recordText}>{wins}-{losses}</span>
                          <span style={styles.diffText}>{diff > 0 ? `+${diff}` : diff}</span>
                          <span style={{ ...styles.statusPill, ...(playoffSeeding ? (inPlayoffs ? styles.pillAlive : styles.pillOut) : styles.pillLB) }}>
                            {playoffSeeding ? (inPlayoffs ? "Playoffs" : "Round robin done") : "Round robin"}
                          </span>
                        </button>
                        {isOpen && (
                          <div style={styles.storyPanel}>
                            {buildTeamStory(team).map((step, i) => (
                              <div key={i} style={styles.storyStep}>
                                <span
                                  style={{
                                    ...styles.storyDot,
                                    ...((step.type === "win" || step.type === "advanced" || step.type === "champion" || step.type === "bye")
                                      ? styles.storyDotGood
                                      : step.type === "loss" || step.type === "missed"
                                      ? styles.storyDotBad
                                      : styles.storyDotNeutral),
                                  }}
                                />
                                <div style={styles.storyBody}>
                                  <div style={styles.storyLabel}>{step.label}</div>
                                  <div style={styles.storyText}>{step.text}</div>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </section>
        )}
      </main>

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}
